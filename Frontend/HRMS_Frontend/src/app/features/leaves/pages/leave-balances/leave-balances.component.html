<div class="card p-6 bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-slate-100 dark:border-zinc-800"
    dir="rtl">
    <p-toast></p-toast>

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div
                class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-900/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                <i class="pi pi-wallet text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100">إدارة أرصدة الإجازات</h1>
                <p class="text-slate-500 dark:text-zinc-400 text-xs mt-1">متابعة أرصدة الموظفين، التوزيع السنوي
                    والتعديلات اليدوية</p>
            </div>
        </div>

        <div class="flex gap-2">
            <p-button label="تهيئة الأرصدة السنوية" icon="pi pi-bolt" (onClick)="openInitializeDialog()"
                styleClass="p-button-rounded p-button-success"></p-button>
        </div>
    </div>

    <!-- Toolbar Filters -->
    <div class="flex flex-wrap gap-4 mb-6 bg-slate-50 dark:bg-zinc-800/50 p-4 rounded-2xl">
        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
            <label class="text-xs font-medium text-slate-500">رقم الموظف</label>
            <div class="p-inputgroup">
                <input type="number" pInputText placeholder="ادخل رقم الموظف..." [(ngModel)]="searchEmployeeId"
                    (keyup.enter)="loadBalances()">
                <button type="button" pButton icon="pi pi-search" (click)="loadBalances()"></button>
            </div>
        </div>
        <div class="flex flex-col gap-1 w-32">
            <label class="text-xs font-medium text-slate-500">السنة</label>
            <input type="number" pInputText [(ngModel)]="currentYear" (change)="loadBalances()">
        </div>
    </div>

    <!-- Table -->
    <p-table [value]="balances()" [loading]="loading()" styleClass="p-datatable-sm p-datatable-gridlines"
        responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr class="bg-slate-50 dark:bg-zinc-950 text-slate-700 dark:text-zinc-300 text-sm">
                <th>نوع الإجازة</th>
                <th class="text-center font-bold">الرصيد الإجمالي</th>
                <th class="text-center">المشتخدم</th>
                <th class="text-center text-blue-600">المتبقي</th>
                <th class="w-32 text-center">الإجراءات</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr class="transition-colors hover:bg-slate-50 dark:hover:bg-zinc-800/50">
                <td class="font-bold text-slate-800 dark:text-zinc-200">
                    {{item.leaveTypeNameAr}}
                </td>
                <td class="text-center font-bold text-slate-700 dark:text-zinc-300">
                    {{item.totalBalance}} يوم
                </td>
                <td class="text-center text-slate-500">
                    {{item.usedBalance}}
                </td>
                <td class="text-center">
                    <span
                        class="bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full font-bold">
                        {{item.remainingBalance}}
                    </span>
                </td>
                <td class="text-center">
                    <button pButton icon="pi pi-pencil" class="p-button-text p-button-rounded p-button-sm"
                        (click)="openAdjustDialog(item)" pTooltip="تعديل يدوي"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-12 text-slate-500">
                    <i class="pi pi-search text-4xl mb-3 block opacity-20"></i>
                    قم بالبحث برقم الموظف لعرض أرصدته
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
