<div class="card p-6 bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-slate-100 dark:border-zinc-800"
    dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100">الإجراءات التأديبية</h1>
            <p class="text-slate-500 dark:text-zinc-400 text-xs mt-1">تعريف الإجراءات والجزاءات المترتبة على المخالفات
            </p>
        </div>
        <p-button label="إجراء جديد" icon="pi pi-plus" (onClick)="openNew()"
            styleClass="p-button-primary p-button-rounded"></p-button>
    </div>

    <p-table [value]="actions()" [rows]="10" [paginator]="true" [loading]="loading()"
        styleClass="p-datatable-sm p-datatable-gridlines" [rowHover]="true">

        <ng-template pTemplate="header">
            <tr class="bg-slate-50 dark:bg-zinc-950 text-slate-700 dark:text-zinc-300 text-sm">
                <th class="w-20">ID</th>
                <th>اسم الإجراء</th>
                <th class="text-center">أيام الخصم</th>
                <th class="text-center">فصل</th>
                <th class="w-32">العمليات</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr class="transition-colors hover:bg-slate-50 dark:hover:bg-zinc-800/50">
                <td>{{item.actionId}}</td>
                <td class="font-medium">{{item.actionNameAr}}</td>
                <td class="text-center">
                    <span *ngIf="item.deductionDays > 0" class="text-red-600 font-bold">{{item.deductionDays}}
                        يوم</span>
                    <span *ngIf="!item.deductionDays || item.deductionDays == 0">-</span>
                </td>
                <td class="text-center">
                    <i class="pi pi-check-circle text-red-500" *ngIf="item.isTermination"></i>
                    <i class="pi pi-circle text-slate-200" *ngIf="!item.isTermination"></i>
                </td>
                <td>
                    <div class="flex gap-2 justify-center">
                        <p-button icon="pi pi-pencil" (onClick)="editAction(item)"
                            styleClass="p-button-text p-button-sm p-button-info"></p-button>
                        <p-button icon="pi pi-trash" (onClick)="deleteAction(item.actionId)"
                            styleClass="p-button-text p-button-sm p-button-danger"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-8 text-slate-400">لا توجد بيانات متاحة</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="displayDialog" [style]="{width: '450px'}"
    [header]="newAction.actionId ? 'تعديل إجراء تأديبي' : 'إضافة إجراء تأديبي جديد'" [modal]="true" class="p-fluid">
    <ng-template pTemplate="content">
        <div class="field mb-4">
            <label class="block text-sm font-medium mb-1">اسم الإجراء (عربي)</label>
            <input type="text" pInputText [(ngModel)]="newAction.actionNameAr" class="w-full" />
            <small class="p-error block" *ngIf="submitted() && !newAction.actionNameAr">الاسم مطلوب</small>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="field mb-4">
                <label class="block text-sm font-medium mb-1">أيام الخصم</label>
                <p-inputnumber [(ngModel)]="newAction.deductionDays" [min]="0" class="w-full"></p-inputnumber>
            </div>
            <div class="field flex items-center mt-6">
                <p-checkbox [(ngModel)]="newAction.isTermination" [binary]="true" label="إنهاء الخدمة"></p-checkbox>
            </div>
        </div>
    </ng-template>
    <ng-template pTemplate="footer">
        <p-button label="إلغاء" icon="pi pi-times" (onClick)="displayDialog.set(false)"
            styleClass="p-button-text"></p-button>
        <p-button label="حفظ" icon="pi pi-check" (onClick)="save()" styleClass="p-button-primary"></p-button>
    </ng-template>
</p-dialog>
