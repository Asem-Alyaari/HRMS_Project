<div class="card p-6 bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-slate-100 dark:border-zinc-800"
    dir="rtl">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div
                class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-900/20 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                <i class="pi pi-briefcase text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100">الوظائف الشاغرة</h1>
                <p class="text-slate-500 dark:text-zinc-400 text-xs mt-1">إدارة احتياجات التوظيف والإعلان عن الوظائف</p>
            </div>
        </div>

        <div class="flex gap-2">
            <p-button label="إعلان جديد" icon="pi pi-plus" styleClass="p-button-rounded p-button-primary"></p-button>
        </div>
    </div>

    <!-- Table -->
    <p-table [value]="vacancies()" [rows]="10" [paginator]="true" [loading]="loading()"
        styleClass="p-datatable-sm p-datatable-gridlines" responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr class="bg-slate-50 dark:bg-zinc-950 text-slate-700 dark:text-zinc-300 text-sm">
                <th>المسمى الوظيفي</th>
                <th>القسم</th>
                <th class="text-center">تاريخ النشر</th>
                <th class="text-center">المتقدمين</th>
                <th class="text-center">الحالة</th>
                <th class="w-32 text-center">الإجراءات</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr class="transition-colors hover:bg-slate-50 dark:hover:bg-zinc-800/50">
                <td class="font-bold text-slate-800 dark:text-zinc-200">{{item.jobTitle}}</td>
                <td class="text-slate-600 dark:text-zinc-400 text-sm">{{item.departmentName}}</td>
                <td class="text-center text-sm text-slate-500">{{item.postedDate | date:'dd/MM/yyyy'}}</td>
                <td class="text-center">
                    <span
                        class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs font-bold">{{item.applicationCount}}</span>
                </td>
                <td class="text-center">
                    <p-tag [value]="getStatusLabel(item.status)" [severity]="getStatusSeverity(item.status)"
                        styleClass="text-[10px]"></p-tag>
                </td>
                <td>
                    <div class="flex justify-center gap-1">
                        <button pButton icon="pi pi-eye"
                            class="p-button-text p-button-rounded p-button-sm text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20"></button>
                        <button pButton icon="pi pi-pencil"
                            class="p-button-text p-button-rounded p-button-sm text-slate-500 hover:bg-slate-50 dark:hover:bg-zinc-800"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center py-12 text-slate-500">لا توجد وظائف شاغرة حالياً</td>
            </tr>
        </ng-template>

    </p-table>
</div>
