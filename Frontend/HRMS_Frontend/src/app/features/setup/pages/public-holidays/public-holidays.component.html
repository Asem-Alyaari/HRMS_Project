<div class="card p-6 bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-slate-100 dark:border-zinc-800"
    dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div
                class="w-12 h-12 rounded-2xl bg-orange-50 dark:bg-orange-900/20 flex items-center justify-center text-orange-600 dark:text-orange-400">
                <i class="pi pi-calendar-plus text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 dark:text-zinc-100">العطل الرسمية</h1>
                <p class="text-slate-500 dark:text-zinc-400 text-xs mt-1">إجازات الأعياد والمناسبات الرسمية لعام
                    {{currentYear}}</p>
            </div>
        </div>

        <div class="flex gap-2">
            <p-button label="إضافة عطلة" icon="pi pi-plus" (onClick)="openNew()"
                styleClass="p-button-rounded p-button-warning"></p-button>
        </div>
    </div>

    <!-- Table -->
    <p-table [value]="holidays()" [loading]="loading()" styleClass="p-datatable-sm p-datatable-gridlines"
        responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr class="bg-slate-50 dark:bg-zinc-950 text-slate-700 dark:text-zinc-300 text-sm">
                <th style="width: 30%">اسم العطلة (عربي)</th>
                <th style="width: 30%">اسم العطلة (إنجليزي)</th>
                <th style="width: 20%" class="text-center">التاريخ</th>
                <th style="width: 10%" class="text-center">تتكرر سنوياً</th>
                <th style="width: 10%" class="text-center">الإجراءات</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-holiday>
            <tr class="transition-colors hover:bg-slate-50 dark:hover:bg-zinc-800/50">
                <td class="font-bold text-slate-800 dark:text-zinc-200">
                    {{holiday.holidayNameAr}}
                </td>
                <td class="text-slate-600 dark:text-zinc-400">
                    {{holiday.holidayNameEn}}
                </td>
                <td class="text-center">
                    <span
                        class="bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full text-sm font-medium">
                        {{holiday.holidayDate | date:'dd/MM/yyyy'}}
                    </span>
                </td>
                <td class="text-center">
                    <i class="pi"
                        [ngClass]="holiday.isRecurring ? 'pi-check-circle text-emerald-500' : 'pi-times-circle text-slate-300'"></i>
                </td>
                <td class="text-center">
                    <button pButton icon="pi pi-trash"
                        class="p-button-text p-button-rounded p-button-danger p-button-sm"
                        (click)="deleteHoliday(holiday)" pTooltip="حذف"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center py-12 text-slate-500">
                    <i class="pi pi-calendar text-4xl mb-3 block opacity-20"></i>
                    لا توجد عطل رسمية مضافة لهذا العام
                </td>
            </tr>
        </ng-template>

    </p-table>
</div>
